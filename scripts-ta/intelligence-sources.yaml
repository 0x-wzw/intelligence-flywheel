# Intelligence Sources Configuration
# Used by market-trends-*.py and daily-insights-publish.py

# ── Thought Leaders (RSS/Atom feeds, Substack, Twitter via Nitter) ──
thought_leaders:
  ai_technology:
    - name: "Yann LeCun"
      feed: "https://www.facebook.com/yann.lecun/rss"
      perspective: "pro-open-source, skeptical-AGI-doom"
    - name: "Andrew Ng"
      feed: "https://www.deeplearning.ai/feed/"
      perspective: "pragmatic-adoption"
    - name: "Gary Marcus"
      feed: "https://garymarcus.substack.com/feed"
      perspective: "skeptic"
    - name: "Sam Altman"
      feed: "https://blog.samaltman.com/rss"
      perspective: "agi-acceleration"
    - name: "Dario Amodei"
      feed: "https://www.anthropic.com/rss"
      perspective: "safety-first"
    - name: "Timnit Gebru"
      feed: "https://www.dair-institute.org/feed"
      perspective: "ai-ethics"
    - name: "Intuition Machine"
      feed: "https://medium.com/feed/intuitionmachine"
      perspective: "agentic-ai, graph-engineering"
    - name: "Peter Steinberger"
      feed: "https://steipete.me/rss.xml"
      perspective: "graph-engineering, agentic-ai"
      note: "X: @steipete. Site redirects from steipete.com to steipete.me"

  business_strategy:
    - name: "Ben Horowitz"
      feed: "https://a16z.com/feed/"
      perspective: "startup-scaling"
    - name: "Naval Ravikant"
      feed: "https://nav.al/rss"
      perspective: "leverage-wealth"
    - name: "Ben Thompson"
      feed: "https://stratechery.com/feed/"
      perspective: "tech-strategy"
    - name: "Elad Gil"
      feed: "https://blog.eladgil.com/feed"
      perspective: "startup-advice"

  economics_policy:
    - name: "Paul Krugman"
      feed: "https://krugman.blogs.nytimes.com/feed/"
      perspective: "progressive-economics"
    - name: "Tyler Cowen"
      feed: "https://marginalrevolution.com/marginalrevolution/index.xml"
      perspective: "market-optimism"
    - name: "Ray Dalio"
      feed: "https://www.linkedin.com/in/ray-dalio/rss"
      perspective: "macro-investing"

